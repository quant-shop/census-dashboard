name: Verify Census Atlas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Census Atlas source
        uses: actions/checkout@v4
        with:
          repository: quant-shop/census
          ref: main
          path: census

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: census/apps/census-atlas/package-lock.json

      - name: Build and test
        working-directory: census/apps/census-atlas
        run: npm ci && npm run check
